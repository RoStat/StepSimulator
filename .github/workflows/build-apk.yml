# Compile l'APK de debug dans le cloud (aucun Android Studio nécessaire) à chaque push,
# puis le publie dans la pré-release GitHub "latest", téléchargeable directement depuis le téléphone.
name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour créer/mettre à jour la release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compiler l'APK de debug
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Lire la version de l'app
        id: version
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "StepSimulator-v${{ steps.version.outputs.name }}-debug.apk"

      - name: Conserver l'APK comme artefact du run
        uses: actions/upload-artifact@v4
        with:
          name: StepSimulator-v${{ steps.version.outputs.name }}-debug-apk
          path: StepSimulator-v${{ steps.version.outputs.name }}-debug.apk

      - name: Publier la pré-release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "StepSimulator-v${VERSION}-debug.apk" \
            --prerelease \
            --title "StepSimulator v${VERSION} – build ${GITHUB_SHA::7}" \
            --notes "APK de debug compilé automatiquement depuis la branche ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}). Installation : télécharger l'APK sur le téléphone, autoriser les sources inconnues, installer par-dessus la version précédente."
